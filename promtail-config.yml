server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://teller-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock

    relabel_configs:
      - source_labels: ['__meta_docker_container_label_app']
        target_label: 'app'

      - source_labels: ['__meta_docker_container_label_service']
        target_label: 'service'

      - source_labels: ['__meta_docker_container_label_env']
        target_label: 'env'

      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'

      - target_label: 'job'
        replacement: 'docker'

      - source_labels: ['__meta_docker_container_log_path']
        target_label: '__path__'

      - source_labels: ['__meta_docker_container_label_role']
        target_label: 'role'

      - source_labels: ['__meta_docker_container_network_ip']
        target_label: '__address__'
        replacement: '$1:3030'

    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            service: service

      - labels:
          level:

  - job_name: teller-api-log-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: teller-api
          service: api
          role: gateway
          env: dev
          __path__: /srv/applications/logs/teller_api/**/*.log